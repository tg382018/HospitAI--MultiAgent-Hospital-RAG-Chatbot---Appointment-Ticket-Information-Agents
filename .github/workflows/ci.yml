name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hospitai
          POSTGRES_PASSWORD: hospitai_dev_password
          POSTGRES_DB: hospitai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://hospitai:hospitai_dev_password@localhost:5432/hospitai
      JWT_SECRET: ci-test-secret-min-32-chars-xxxxxxxxxxx
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            agent/pyproject.toml
      - name: Install packages
        run: |
          python -m pip install -U pip
          pip install -e ../agent
          pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check src tests alembic
          ruff format --check src tests alembic
      - name: Apply migrations
        run: alembic upgrade head
      - name: Pytest + Coverage
        run: pytest --cov --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck -w frontend
      - run: npm run lint -w frontend
      - run: npm run test -w frontend
      - run: npm run build -w frontend

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build -w hospital/admin
      - run: npm run typecheck -w hospital/admin

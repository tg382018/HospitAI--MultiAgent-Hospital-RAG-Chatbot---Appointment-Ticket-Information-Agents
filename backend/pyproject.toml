[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hospitai"
version = "0.0.1"
description = "Hospital AI Agent Platform — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "hospitai-agent==0.0.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "structlog>=24.4",
  "pyjwt>=2.9.0",
  "bcrypt>=4.2.0",
  "email-validator>=2.0.0",
  "python-multipart>=0.0.18",
  "aiofiles>=24.1",
  "httpx>=0.28",
  "celery[redis]>=5.4",
  "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "anyio>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hospitai"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"src/hospitai/api/routers/**/*.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/hospitai"]
omit = ["*/alembic/*", "*/migrations/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
# Baseline ~48% (large chat-tool surface is integration-tested manually).
# Raise toward 50%+ as appointment/RAG tool unit tests grow.
fail_under = 47

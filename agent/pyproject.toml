[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hospitai-agent"
version = "0.0.1"
description = "HospitAI LangGraph workflow and LLM nodes (agent layer)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "structlog>=24.4",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
]

[project.optional-dependencies]
dev = ["ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/hospitai_agent"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xyz-hospital"
version = "0.0.1"
description = "XYZ Hospital reference hospital-system API (SQLite, production-style contract)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/xyz_hospital"]
